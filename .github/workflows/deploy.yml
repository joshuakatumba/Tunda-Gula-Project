name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize SSH host
        id: ssh_host
        env:
          RAW_HOST: ${{ secrets.AWS_HOST || secrets.AZURE_HOST }}
        run: |
          set -euo pipefail
          ENDPOINT="$(printf '%s' "$RAW_HOST" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##')"
          HOST="$ENDPOINT"
          PORT="${RAW_PORT:-22}"

          if [[ "$ENDPOINT" =~ ^\[([^]]+)\]:([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          elif [[ "$ENDPOINT" =~ ^([^:]+):([0-9]+)$ ]]; then
            HOST="${BASH_REMATCH[1]}"
            PORT="${BASH_REMATCH[2]}"
          fi

          if [ -z "$HOST" ]; then
            echo "SSH Host secret is empty or invalid."
            exit 1
          fi

          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "SSH port is invalid: $PORT"
            exit 1
          fi

          echo "value=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.ssh_host.outputs.value }}
          username: ${{ secrets.AWS_USERNAME || secrets.AZURE_USERNAME || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY || secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            echo " Deploying latest code on AWS EC2..."
            cd ~/Tunda-Gula-Project

            # Pull latest changes from main branch
            git pull origin main

            # Build and restart containers in detached mode
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

            # Remove dangling images to keep free-tier disk clean
            docker image prune -f

            echo "Deployment completed successfully!"