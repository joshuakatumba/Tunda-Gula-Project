# =============================================================================
# TundaGula — Unified Docker Compose
#
# Services:
#   db       — PostgreSQL 16 database
#   backend  — Django REST Framework API (gunicorn)
#   frontend — React 18 SPA (Vite + Nginx)
#
# Usage:
#   cp .env.example .env        # create env file, edit values
#   docker compose up --build   # build and start all services
#   docker compose down         # stop all services
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tundagula_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tundagula}
      POSTGRES_USER: ${POSTGRES_USER:-tundagula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tundagula_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tundagula}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Django Backend API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tundagula_backend
    restart: unless-stopped
    env_file: .env
    # The entrypoint in backend/Dockerfile handles migrations & superuser
    ports:
      - "8001:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # React Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the API URL to Vite during the build process
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001/api/v1}
    container_name: tundagula_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
